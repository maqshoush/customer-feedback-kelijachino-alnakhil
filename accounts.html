<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الحسابات</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
background:#f5f5f5;
padding:25px;
}


h1{
text-align:center;
}


.box{

background:white;
max-width:1200px;
margin:30px auto;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px #0002;
overflow:auto;

}


button{

padding:10px 15px;
border:0;
border-radius:8px;
background:#222;
color:white;
cursor:pointer;
margin:5px;

}


.add{
background:green;
}


.delete{
background:red;
}


table{

width:100%;
border-collapse:collapse;
min-width:1000px;

}


th{

background:#222;
color:white;
padding:12px;

}


td{

padding:12px;
border-bottom:1px solid #ddd;
text-align:center;

}


.active{

color:green;
font-weight:bold;

}


.off{

color:red;
font-weight:bold;

}


input,select{

width:100%;
padding:12px;
margin:7px 0;
border-radius:8px;
border:1px solid #ddd;

}


/* نافذة الإضافة */

#addBox{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0008;
z-index:999;

}


.modal{

background:white;
width:90%;
max-width:450px;
margin:50px auto;
padding:25px;
border-radius:20px;

}


</style>


</head>


<body>


<h1>
إدارة الحسابات
</h1>



<div style="text-align:center">

<button class="add" onclick="addAccount()">

+ إضافة حساب

</button>

</div>




<div class="box">


<table>


<thead>

<tr>

<th>الاسم</th>
<th>اسم المستخدم</th>
<th>تاريخ الإنشاء</th>
<th>البريد</th>
<th>الجوال</th>
<th>الصلاحية</th>
<th>الحالة</th>
<th>آخر دخول</th>
<th>الإجراءات</th>


</tr>


</thead>



<tbody id="table"></tbody>


</table>


</div>




<button onclick="back()">

العودة للوحة الإدارة

</button>





<!-- نافذة إضافة حساب -->


<div id="addBox">


<div class="modal">


<h2 style="text-align:center">

إضافة حساب جديد

</h2>



<input id="name" placeholder="الاسم">


<input id="newUser" placeholder="اسم المستخدم">


<input id="newPass" type="password" placeholder="كلمة المرور">


<input id="email" placeholder="البريد">


<input id="phone" placeholder="رقم الجوال">



<select id="role">

<option value="موظف">
موظف
</option>


<option value="مدير النظام">
مدير النظام
</option>


</select>



<button style="background:green" onclick="saveAccount()">

حفظ

</button>



<button style="background:red" onclick="closeAdd()">

إلغاء

</button>



<div id="addMsg"></div>


</div>


</div>






<script>



const API="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";





function load(){


fetch(API,{

method:"POST",

body:JSON.stringify({

action:"accounts"

})

})


.then(r=>r.json())


.then(data=>{


let html="";


data.forEach(a=>{


html+=`

<tr>

<td>${a.name || "-"}</td>

<td>${a.username || "-"}</td>

<td>${a.created || "-"}</td>

<td>${a.email || "-"}</td>

<td>${a.phone || "-"}</td>

<td>${a.role || "-"}</td>


<td class="${a.status=="فعال"?"active":"off"}">

${a.status || "-"}

</td>


<td>${a.last || "-"}</td>



<td>


<button onclick="toggle('${a.username}')">

تفعيل/تعطيل

</button>


<button class="delete" onclick="del('${a.username}')">

حذف

</button>


</td>


</tr>


`;


});


document.getElementById("table").innerHTML=html;


});


}






function addAccount(){

document.getElementById("addBox").style.display="block";

}





function closeAdd(){

document.getElementById("addBox").style.display="none";

}





function saveAccount(){



let data={


action:"addAccount",

name:document.getElementById("name").value,

username:document.getElementById("newUser").value,

password:document.getElementById("newPass").value,

email:document.getElementById("email").value,

phone:document.getElementById("phone").value,

role:document.getElementById("role").value


};



fetch(API,{

method:"POST",

body:JSON.stringify(data)

})


.then(r=>r.json())


.then(res=>{


if(res.success){


alert("تم إنشاء الحساب بنجاح");


location.reload();


}

else{


document.getElementById("addMsg").innerHTML=

"<p style='color:red'>"+res.message+"</p>";


}


});


}






function toggle(user){


if(confirm("هل أنت متأكد من تغيير حالة الحساب؟")){


fetch(API,{

method:"POST",

body:JSON.stringify({

action:"toggle",

username:user

})

})

.then(()=>load());


}


}







function del(user){


if(confirm("⚠️ هل أنت متأكد من حذف الحساب؟")){


fetch(API,{

method:"POST",

body:JSON.stringify({

action:"delete",

username:user

})

})

.then(()=>load());


}


}






function back(){

location.href="dashboard.html";

}




load();



</script>



</body>

</html>
