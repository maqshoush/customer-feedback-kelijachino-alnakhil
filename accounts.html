<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الحسابات</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}


body{

margin:0;
background:#f5f5f5;
padding:25px;

}



h1{

text-align:center;
color:#222;

}



.box{

background:white;

max-width:900px;

margin:30px auto;

padding:20px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#222;

color:white;

padding:15px;

}



td{

padding:15px;

border-bottom:1px solid #ddd;

text-align:center;

}



.status{

color:green;

font-weight:bold;

}



button{

padding:10px 20px;

border:none;

border-radius:8px;

background:#222;

color:white;

cursor:pointer;

}



.back{

display:block;

margin:20px auto;

width:200px;

}



</style>

</head>


<body>


<h1>
إدارة الحسابات
</h1>



<div class="box">


<table>


<tr>

<th>الاسم</th>
<th>اسم المستخدم</th>
<th>الصلاحية</th>
<th>الحالة</th>
<th>آخر دخول</th>

</tr>



<tr>

<td>إدارة النظام</td>

<td>PROGRAMMRER</td>

<td>مدير النظام</td>

<td class="status">فعال</td>

<td>-</td>


</tr>



</table>


</div>




<button class="back" onclick="back()">

العودة للوحة الإدارة

</button>



<script>

function back(){

window.location.href="dashboard.html";

}

</script>



</body>

</html>
