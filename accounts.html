<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<script src="auth.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الحسابات</title>


<style>
.back-btn{

position:fixed;

top:20px;
right:20px;

width:52px;
height:52px;

border-radius:50%;

border:1px solid rgba(0,0,0,0.15);

background:rgba(255,255,255,0.35);

backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);

box-shadow:
0 8px 25px rgba(0,0,0,0.12),
inset 0 0 10px rgba(255,255,255,0.5);

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

z-index:9999;

transition:.3s;

}


.back-btn span{

font-size:38px;

font-family:Arial;

font-weight:300;

line-height:1;

color:#111;

margin-top:-5px;

}



/* الوضع الليلي */

body.dark .back-btn{

background:rgba(255,255,255,0.12);

border:1px solid rgba(255,255,255,0.25);

box-shadow:
0 8px 25px rgba(0,0,0,0.4),
inset 0 0 10px rgba(255,255,255,0.15);

}



body.dark .back-btn span{

color:white;

}

 
*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}


body{

margin:0;
background:#f5f5f5;
padding:30px;

}


h1{

text-align:center;
color:#222;
margin-bottom:35px;

}



.container{

max-width:1200px;
margin:auto;

}



.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;

}



.card{

background:white;
border-radius:22px;
padding:25px;

box-shadow:0 8px 25px rgba(0,0,0,.08);

transition:.3s;

}



.card:hover{

transform:translateY(-5px);

}



.icon{

font-size:45px;
text-align:center;
margin-bottom:15px;

}



.info{

margin-bottom:10px;
color:#444;

}



.info span{

font-weight:bold;
color:#222;

}



.status{

display:inline-block;
padding:6px 14px;
border-radius:20px;
font-size:14px;

}



.active{

background:#d9f7df;
color:green;

}



.disabled{

background:#ffe0e0;
color:red;

}



.actions{

display:flex;
gap:10px;
margin-top:20px;

}



button{

flex:1;
padding:12px;

border:0;
border-radius:12px;

cursor:pointer;

font-size:15px;

}



.toggle{

background:#159447;
color:white;

}



.delete{

background:#e53935;
color:white;

}



.back{

display:block;
margin:35px auto 0;

width:220px;

background:#222;
color:white;

padding:14px;

}

body.dark{

background:#111;
color:white;

}


body.dark .card,
body.dark .box{

background:#1e1e1e;
color:white;

}


body.dark h1,
body.dark h2{

color:white;

}


body.dark .info{

color:#ddd;

}


body.dark .info span{

color:white;

}


body.dark button{

color:white;

}

</style>


</head>



<body>
<button class="back-btn" onclick="goBack()">
<span>‹</span>
</button>


<div class="container">


<h1>
👥 إدارة الحسابات
</h1>


<div id="table" class="cards"></div>



<button class="back" onclick="back()">

العودة للوحة الإدارة

</button>


</div>



<script>


const URL="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";



fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"accounts"

})

})


.then(r=>r.json())


.then(data=>{


let html="";


data.forEach(a=>{


let statusClass =
a.status=="فعال"
?
"active"
:
"disabled";



html+=`

<div class="card">


<div class="icon">
👤
</div>



<div class="info">
<span>الاسم:</span>
${a.name}
</div>


<div class="info">
<span>اسم المستخدم:</span>
${a.username}
</div>



<div class="info">
<span>البريد:</span>
${a.email}
</div>



<div class="info">
<span>الجوال:</span>
${a.phone}
</div>



<div class="info">
<span>الصلاحية:</span>
${a.role}
</div>



<div class="info">

<span>الحالة:</span>

<br>

<span class="status ${statusClass}">
${a.status}
</span>

</div>



<div class="actions">


<button class="toggle" onclick="toggle('${a.username}')">

تفعيل / تعطيل

</button>



<button class="delete" onclick="del('${a.username}')">

حذف

</button>



</div>


</div>

`;


});



document.getElementById("table").innerHTML=html;



});





function toggle(user){


if(confirm("هل أنت متأكد من تغيير حالة هذا الحساب؟")){


fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"toggle",

username:user

})

})

.then(()=>location.reload());


}


}






function del(user){


if(confirm("⚠️ هل أنت متأكد من حذف هذا الحساب؟\nلا يمكن التراجع بعد الحذف.")){


fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"delete",

username:user

})

})

.then(()=>location.reload());


}


}



function goBack(){

window.location.href="dashboard.html";

}
</script>


<script src="theme.js"></script>

</body>

</html>
 


<script src="theme.js"></script>
</body>

</html>
