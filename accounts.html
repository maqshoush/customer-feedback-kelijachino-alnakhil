<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الحسابات</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
}

.box{
background:white;
padding:20px;
border-radius:20px;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#222;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

button{
padding:8px 12px;
border:0;
border-radius:8px;
cursor:pointer;
}

.delete{
background:red;
color:white;
}

.toggle{
background:green;
color:white;
}

.back{
margin-top:20px;
background:#222;
color:white;
}

</style>

</head>


<body>


<h1>
إدارة الحسابات
</h1>


<div class="box">

<table>

<thead>

<tr>
<th>الاسم</th>
<th>اسم المستخدم</th>
<th>البريد</th>
<th>الجوال</th>
<th>الصلاحية</th>
<th>الحالة</th>
<th>الإجراء</th>
</tr>

</thead>


<tbody id="table">

</tbody>


</table>

</div>



<button class="back" onclick="back()">
العودة للوحة الإدارة
</button>



<script>


const URL="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";



fetch(URL,{
method:"POST",
body:JSON.stringify({
action:"accounts"
})
})


.then(r=>r.json())


.then(data=>{


let html="";


data.forEach(a=>{


html+=`

<tr>

<td>${a.name}</td>

<td>${a.username}</td>

<td>${a.email}</td>

<td>${a.phone}</td>

<td>${a.role}</td>

<td>${a.status}</td>


<td>

<button class="toggle" onclick="toggle('${a.username}')">
تفعيل/تعطيل
</button>


<button class="delete" onclick="del('${a.username}')">
حذف
</button>


</td>


</tr>

`;


});


document.getElementById("table").innerHTML=html;


});




function toggle(user){

fetch(URL,{
method:"POST",
body:JSON.stringify({
action:"toggle",
username:user
})
})
.then(()=>location.reload());

}




function del(user){

if(confirm("حذف الحساب؟")){

fetch(URL,{
method:"POST",
body:JSON.stringify({
action:"delete",
username:user
})
})
.then(()=>location.reload());

}

}




function back(){

location.href="dashboard.html";

}


</script>


</body>

</html>
