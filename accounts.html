<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الحسابات</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma;
}


body{

margin:0;
background:#f5f5f5;
padding:25px;

}


h1{

text-align:center;

}



.box{

background:white;

max-width:1100px;

margin:30px auto;

padding:20px;

border-radius:20px;

box-shadow:0 5px 20px #0002;

overflow:auto;

}



button{

padding:10px 15px;

border:0;

border-radius:8px;

background:#222;

color:white;

cursor:pointer;

margin:5px;

}


.add{

background:green;

}



.delete{

background:red;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#222;

color:white;

padding:12px;

}



td{

padding:12px;

border-bottom:1px solid #ddd;

text-align:center;

}



.active{

color:green;

font-weight:bold;

}


.off{

color:red;

font-weight:bold;

}



</style>

</head>


<body>


<h1>
إدارة الحسابات
</h1>


<div style="text-align:center">

<button class="add" onclick="addAccount()">
+ إضافة حساب
</button>

</div>



<div class="box">


<table>


<thead>

<tr>

<th>الاسم</th>
<th>المستخدم</th>
<th>الصلاحية</th>
<th>الحالة</th>
<th>آخر دخول</th>
<th>الإجراءات</th>

</tr>

</thead>


<tbody id="table">

</tbody>


</table>


</div>



<button onclick="back()">

العودة للوحة الإدارة

</button>



<script>


const API="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";



function load(){


fetch(API,{

method:"POST",

body:JSON.stringify({

action:"accounts"

})

})

.then(r=>r.json())

.then(data=>{


let html="";


data.forEach(a=>{


html+=`

<tr>

<td>${a.name}</td>

<td>${a.username}</td>

<td>${a.role}</td>


<td class="${a.status=="فعال"?"active":"off"}">

${a.status}

</td>


<td>${a.last || "-"}</td>


<td>


<button onclick="toggle('${a.username}')">

تفعيل/تعطيل

</button>


<button class="delete" onclick="del('${a.username}')">

حذف

</button>


</td>


</tr>


`;



});


document.getElementById("table").innerHTML=html;



});


}





function toggle(user){


if(confirm("هل أنت متأكد من تغيير حالة الحساب؟")){


fetch(API,{

method:"POST",

body:JSON.stringify({

action:"toggle",

username:user

})

})
.then(()=>load());


}


}





function del(user){


if(confirm("⚠️ هل أنت متأكد من حذف الحساب؟ لا يمكن التراجع عن هذا الإجراء")){


fetch(API,{

method:"POST",

body:JSON.stringify({

action:"delete",

username:user

})

})
.then(()=>load());


}


}




function addAccount(){

alert("سنضيف نافذة إضافة الحساب في التحديث القادم");

}




function back(){

location.href="dashboard.html";

}



load();


</script>



</body>

</html>
