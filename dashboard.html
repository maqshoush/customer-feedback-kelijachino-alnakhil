<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة</title>

<style>
.notifyBox{

position:absolute;

top:110px;
left:0;

background:#ff3030;

color:white;

height:55px;

min-width:180px;

padding:0 25px;

border-radius:30px;

font-size:20px;

font-weight:bold;

display:none;

align-items:center;

justify-content:center;

white-space:nowrap;

transition:all 1s ease;

transform:scale(1);

opacity:1;

}


.notifyBox.small{

min-width:55px;

width:55px;

height:55px;

padding:0;

border-radius:50%;

font-size:22px;

transition:all 1s ease;

}

.notifyBox.small{

width:60px;

padding:0;

font-size:25px;

}
*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#f5f5f5;
padding:30px;
}

h1{
text-align:center;
color:#222;
margin-bottom:40px;
}

.container{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
max-width:900px;
margin:auto;

}

.card{

background:white;
padding:35px 20px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 20px #0002;
cursor:pointer;

}

.icon{

font-size:45px;
margin-bottom:15px;

}

h2{

margin:0;
color:#222;

}

.logout{

display:block;
margin:40px auto;
width:200px;
padding:15px;
border:none;
border-radius:10px;
background:#222;
color:white;
cursor:pointer;

}
.top-bar{

display:flex;
justify-content:space-between;
align-items:center;

}


#themeBtn{

width:50px;
height:50px;

border:none;
border-radius:50%;

font-size:25px;

cursor:pointer;

background:white;

}



body.dark{

background:#111;
color:white;

}


body.dark .card,
body.dark .box{

background:#1e1e1e;
color:white;

}


body.dark h1,
body.dark h2{

color:white;

}
</style>

</head>


<body>
  <div id="notifyBox" class="notifyBox"></div>
<div class="top-bar">

<h1>
لوحة الإدارة
</h1>


<button id="themeBtn" onclick="toggleTheme()">
🌙
</button>

</div>





<div class="container">


<div class="card" onclick="ratings()">
<div class="icon">📊</div>
<h2>التقييمات</h2>
</div>


<div class="card" onclick="accounts()">
<div class="icon">👥</div>
<h2>الحسابات</h2>
</div>


<div class="card" onclick="requests()">
<div class="icon">📩</div>
<h2>طلبات التسجيل</h2>
</div>


</div>


<button class="logout" onclick="logout()">
تسجيل خروج
</button>



<script>

function ratings(){

window.location.href=
"https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";

}


function accounts(){

window.location.href="accounts.html";

}


function requests(){

window.location.href="requests.html";

}


function logout(){

window.location.href="admin.html";

}
const URL="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";


function checkRequests(){


fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"requestCount"

})

})


.then(r=>r.json())


.then(data=>{


let count=data.count;

let box=document.getElementById("notifyBox");


if(count>0){


box.style.display="flex";

box.classList.remove("small");


box.innerHTML="لديك "+count+" طلبات جديدة!";


setTimeout(()=>{

box.style.width="55px";
box.style.minWidth="55px";
box.style.padding="0";
box.style.borderRadius="50%";
box.style.fontSize="22px";

box.innerHTML=count;

},5000);


}

else{


box.style.display="none";


}


});


}



checkRequests();

setInterval(checkRequests,60000);
</script>
<script src="auth.js"></script>
  <script src="theme.js"></script>
</body>

</html>
