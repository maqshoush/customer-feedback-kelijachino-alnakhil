 <link rel="stylesheet" href="loader.css">

<style>

.notifyBox{

position:absolute;

top:10px;

left:10px;

background:#ff3030;

color:white;

height:45px;

min-width:150px;

padding:0 20px;

border-radius:25px;

font-size:16px;

font-weight:bold;

display:none;

align-items:center;

justify-content:center;

white-space:nowrap;

transition:all 1s ease;

}


.notifyBox.small{

min-width:45px;

width:45px;

height:45px;

padding:0;

border-radius:50%;

font-size:20px;

}


body{

margin:0;

min-height:100vh;

background:#f5f5f5;

padding:30px;

}


.request-card{

position:relative;

}


h1{

text-align:center;

color:#222;

margin-bottom:40px;

}


.container{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:25px;

max-width:900px;

margin:auto;

}


.card{

background:white;

padding:35px 20px;

border-radius:20px;

text-align:center;

box-shadow:0 5px 20px #0002;

}


.icon{

font-size:45px;

margin-bottom:15px;

}


h2{

margin:0;

color:#222;

}


.logout{

display:block;

width:200px;

padding:15px;

background:#222;

color:white;

}


.top-bar{

}


#themeBtn{

width:50px;

height:50px;

border:none;

border-radius:50%;

font-size:25px;

cursor:pointer;

background:white;

}


body.dark{

background:#111;

color:white;

}


body.dark .card,
body.dark .box{

background:#1e1e1e;

color:white;

}


body.dark h1,
body.dark h2{

}

 .brand-footer{

margin-top:70px;
text-align:center;
position:relative;
overflow:hidden;
padding:50px 20px;
}


.brand-logo{

width:120px;
position:relative;
z-index:2;

}


.brand-footer h3{

color:#111;
font-size:22px;
position:relative;
z-index:2;

}


.brand-footer p{

color:#777;
font-size:15px;
line-height:2;
position:relative;
z-index:2;

}


.tech-lines{

position:absolute;
bottom:0;
left:0;
width:100%;
height:150px;

background:
linear-gradient(
90deg,
transparent,
#1da1f2,
#7b2cff,
transparent
);

opacity:.25;

filter:blur(20px);

animation:moveColor 6s infinite;

}



@keyframes moveColor{

0%{
background-position:0%;
}

50%{
background-position:100%;
}

100%{
background-position:0%;
}

}
.brand-footer{
text-align:center;
margin-top:120px;
padding:40px 20px 0;
overflow:hidden;
}


.brand-logo{
width:260px;
height:auto;
object-fit:contain;
margin-bottom:30px;
}

.support{

display:flex;
align-items:center;
justify-content:center;

gap:6px;

margin:20px auto 0;

width:220px;
height:40px;

border-radius:25px;

color:white;
text-decoration:none;

font-size:14px;
font-weight:bold;

background:linear-gradient(
90deg,
#1597ff,
#6c35ff,
#d946ef,
#1597ff
);

background-size:300% 300%;

animation:supportMove 5s linear infinite;

box-shadow:
0 5px 15px rgba(80,120,255,.3);

}



@keyframes supportMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}


.brand-footer{
padding:30px 15px 0;
}


.brand-logo{
width:230px;
}


.brand-footer{
padding:30px 15px 0;
}

.brand-footer h3{

font-size:14px;

white-space:nowrap;

line-height:1.8;

padding:0 10px;

}


.brand-footer p{

font-size:14px;

}


.tech-lines{

height:180px;

margin-top:25px;

}
 
@media (max-width:600px){

.support{


width:240px;
max-width:240px;
height:45px;



font-size:15px;

gap:10px;

}

.support img{

<body>

<div class="top-bar">

<div class="container">


<div class="card" onclick="ratings()">

<h2>التقييمات</h2>

</div>



<div class="card" onclick="accounts()">

<div class="icon">👥</div>

<h2>الحسابات</h2>

</div>




<div class="card request-card" onclick="requests()">

<div id="notifyBox" class="notifyBox"></div>


<div class="icon">📩</div>

<h2>طلبات التسجيل</h2>

</div>




</div>


<button class="logout" onclick="logout()">

تسجيل خروج

</button>

<div class="brand-footer">

<a href="https://wa.me/966582261016" class="support">
<img src="رمز-الدعم.png">
<span>الدعم الفني 0582261016</span>
</a>


<h3>
ابتُكِر وصُمم بفخر في المملكة العربية السعودية 🇸🇦
</h3>


<p>
الإصدار: 1.0.0
<br>
حالة النظام: يعمل
<br>

</p>


<div class="tech-lines"></div>


</div>

<script>


function ratings(){

showLoader();

window.location.href="loading.html";


}


function accounts(){

showLoader();

window.location.href="accounts.html";

}


function requests(){

showLoader();

window.location.href="requests.html";

}




function logout(){

window.location.href="admin.html";

}



const URL="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";



function checkRequests(){


fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"requestCount"

})

})


.then(r=>r.json())


.then(data=>{


let count=data.count;

let box=document.getElementById("notifyBox");



if(count>0){


box.style.display="flex";


box.classList.remove("small");


box.innerHTML="لديك "+count+" طلبات جديدة!";



setTimeout(()=>{


box.classList.add("small");


box.innerHTML=count;



},5000);



}

else{


box.style.display="none";


}


});


}



checkRequests();


setInterval(checkRequests,60000);


</script>


<script src="auth.js"></script>

<script src="theme.js"></script>
