<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:#f5f5f5;
padding:30px;
}

h1{
text-align:center;
color:#222;
margin-bottom:40px;
}

.container{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
max-width:900px;
margin:auto;

}

.card{

background:white;
padding:35px 20px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 20px #0002;
cursor:pointer;

}

.icon{

font-size:45px;
margin-bottom:15px;

}

h2{

margin:0;
color:#222;

}

.logout{

display:block;
margin:40px auto;
width:200px;
padding:15px;
border:none;
border-radius:10px;
background:#222;
color:white;
cursor:pointer;

}

</style>

</head>


<body>


<h1>
لوحة الإدارة
</h1>


<div class="container">


<div class="card" onclick="ratings()">
<div class="icon">📊</div>
<h2>التقييمات</h2>
</div>


<div class="card" onclick="accounts()">
<div class="icon">👥</div>
<h2>الحسابات</h2>
</div>


<div class="card" onclick="requests()">
<div class="icon">📩</div>
<h2>طلبات التسجيل</h2>
</div>


</div>


<button class="logout" onclick="logout()">
تسجيل خروج
</button>



<script>

function ratings(){

window.location.href=
"https://script.google.com/macros/s/AKfycbxWIzQoHaQA0RtQiXrL6N0xjcXEE0StIxTrvdsSiGqkvBBYkeX07-ve58jeACZXTdgk_A/exec";

}


function accounts(){

window.location.href="accounts.html";

}


function requests(){

window.location.href="requests.html";

}


function logout(){

window.location.href="admin.html";

}

</script>


</body>

</html>
