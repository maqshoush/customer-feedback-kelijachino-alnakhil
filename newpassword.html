<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تغيير كلمة المرور</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f7f7f7;
}

.box{

width:90%;
max-width:400px;
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 5px 25px #0002;
text-align:center;

}

input,button{

width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
font-size:16px;

}

input{
border:1px solid #ddd;
}

button{

border:0;
background:#222;
color:white;
cursor:pointer;

}

#msg{
color:red;
}

</style>

</head>


<body>


<div class="box">


<h2>
تغيير كلمة المرور
</h2>


<input id="password" type="password" placeholder="كلمة المرور الجديدة">


<input id="confirm" type="password" placeholder="تأكيد كلمة المرور">


<button onclick="changePassword()">
حفظ كلمة المرور
</button>


<div id="msg"></div>


</div>



<script>


const URL="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";



let email =
new URLSearchParams(location.search).get("email");



function changePassword(){


let password =
document.getElementById("password").value.trim();


let confirm =
document.getElementById("confirm").value.trim();



if(password=="" || confirm==""){

document.getElementById("msg").innerHTML=
"اكتب كلمة المرور كاملة";

return;

}



if(password!=confirm){

document.getElementById("msg").innerHTML=
"كلمتا المرور غير متطابقتين";

return;

}



fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"changePassword",

email:email,

password:password

})

})


.then(r=>r.json())

.then(data=>{


if(data.success){


document.getElementById("msg").style.color="green";

document.getElementById("msg").innerHTML=
"تم تغيير كلمة المرور بنجاح";


setTimeout(()=>{

location.href="admin.html";

},2000);


}

else{

document.getElementById("msg").innerHTML=
data.message;

}


});


}


</script>


</body>

</html>
