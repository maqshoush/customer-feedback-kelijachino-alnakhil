<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة الإدارة</title>

<style>

*{
    box-sizing:border-box;
    font-family: Arial, Tahoma, sans-serif;
}


body{

    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#f7f7f7;

}


/* صندوق تسجيل الدخول */

.login-box{

    width:90%;
    max-width:420px;

    background:white;

    padding:35px;

    border-radius:18px;

    box-shadow:0 5px 25px rgba(0,0,0,0.12);

    text-align:center;

}



/* العنوان */

h2{

    margin-bottom:30px;

    font-size:clamp(22px,4vw,32px);

    color:#222;

}



/* الحقول */

input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:1px solid #ddd;

    border-radius:10px;

    font-size:16px;

    outline:none;

}


input:focus{

    border-color:#333;

}



/* الزر */

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:#222;

    color:white;

    font-size:16px;

    cursor:pointer;

}


button:hover{

    background:#000;

}



/* للجوال */

@media(max-width:600px){

    .login-box{

        width:92%;

        padding:25px;

    }


    h2{

        margin-bottom:20px;

    }

}



</style>


</head>


<body>


<div class="login-box">


<h2>لوحة الإدارة</h2>


<input type="text" placeholder="اسم المستخدم">


<input type="password" placeholder="كلمة المرور">


<button>
دخول
</button>


</div>


</body>

</html>
