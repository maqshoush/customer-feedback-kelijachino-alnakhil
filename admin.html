<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل دخول الإدارة</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}


body{

margin:0;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#f7f7f7;

}


.login-box{

width:90%;
max-width:420px;

background:white;

padding:35px;

border-radius:18px;

box-shadow:0 5px 25px rgba(0,0,0,.12);

text-align:center;

}


h2{

margin-bottom:30px;

color:#222;

}


input{

width:100%;

padding:14px;

margin-bottom:15px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

}



button{

width:100%;

padding:14px;

border:0;

border-radius:10px;

background:#222;

color:white;

font-size:16px;

cursor:pointer;

}


button:hover{

background:#000;

}



#message{

margin-top:15px;

color:red;

display:none;

}



</style>

</head>



<body>


<div class="login-box">


<h2>
لوحة الإدارة
</h2>


<input id="username" type="text" placeholder="اسم المستخدم">


<input id="password" type="password" placeholder="كلمة المرور">


<button onclick="login()">
دخول
</button>


<div id="message"></div>


</div>




<script>


const scriptURL = 
"https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";



function login(){


let username =
document.getElementById("username").value;


let password =
document.getElementById("password").value;



fetch(scriptURL,{

method:"POST",

body:JSON.stringify({

username:username,

password:password

})

})


.then(response=>response.json())


.then(data=>{


if(data.success){


window.location.href="dashboard.html";


}

else{


let msg=document.getElementById("message");

msg.style.display="block";

msg.innerHTML=data.message;


}



})


.catch(()=>{


let msg=document.getElementById("message");

msg.style.display="block";

msg.innerHTML="حدث خطأ في الاتصال";


});



}


</script>


</body>

</html>
