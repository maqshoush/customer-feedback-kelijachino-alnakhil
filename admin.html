<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل دخول الإدارة</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}


body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#f7f7f7;

}



.login-box{

width:90%;

max-width:400px;

background:white;

padding:35px;

border-radius:18px;

box-shadow:0 5px 25px rgba(0,0,0,.12);

text-align:center;

}



h2{

margin-bottom:30px;

color:#222;

}



input{

width:100%;

padding:14px;

margin-bottom:15px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

}



button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#222;

color:white;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#000;

}



#message{

margin-top:15px;

color:red;

}



</style>

</head>


<body>


<div class="login-box">


<h2>
لوحة الإدارة
</h2>



<input id="username" type="text" placeholder="اسم المستخدم">


<input id="password" type="password" placeholder="كلمة المرور">


<button onclick="login()">
دخول
</button>
<a href="register.html" style="
display:block;
margin-top:15px;
color:green;
text-decoration:none;
font-size:15px;
">
طلب إنشاء حساب جديد
</a>

<div id="message"></div>


</div>



<script>


function login(){


let username =
document.getElementById("username").value;


let password =
document.getElementById("password").value;



if(username=="" || password==""){

document.getElementById("message").innerHTML =
"أدخل البيانات كاملة";

return;

}



fetch("https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec",
{

method:"POST",

body:JSON.stringify({

action:"login",

username:username,

password:password

})






})

.then(response=>response.json())





.then(data=>{

if(data.success){

if(data.role=="مدير النظام"){

window.location.href =
"https://maqshoush.github.io/customer-feedback-kelijachino-alnakhil/dashboard.html";

}

else if(data.role=="موظف"){

window.location.href =
"https://script.google.com/macros/s/AKfycbxWIzQoHaQA0RtQiXrL6N0xjcXEE0StIxTrvdsSiGqkvBBYkeX07-ve58jeACZXTdgk_A/exec";

}

}

else{

document.getElementById("message").innerHTML=data.message;

}

})









    
























.catch(()=>{


document.getElementById("message").innerHTML =
"حدث خطأ في الاتصال";


});


}


</script>



</body>

</html>
