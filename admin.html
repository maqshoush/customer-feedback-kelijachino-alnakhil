<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f7f7f7;
}

.login-box{

width:90%;
max-width:400px;

background:white;

padding:25px 35px 35px;

border-radius:18px;

text-align:center;

border:3px solid transparent;

background:
linear-gradient(white,white) padding-box,
linear-gradient(
270deg,
#12A8FF,
#2563EB,
#8B2CFF,
#F03BD4
) border-box;

background-size:400% 400%;

animation:borderMove 15s ease infinite;

box-shadow:0 5px 25px #0002;

}


@keyframes borderMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}



.logo{
width:100%;
max-width:330px;
height:auto;
margin-bottom:25px;
}



input,button{

width:100%;

padding:14px;

margin-bottom:15px;

border-radius:10px;

font-size:16px;

}


input{

border:1px solid #ddd;

}



button{

border:0;

color:white;

cursor:pointer;


background:linear-gradient(
270deg,
#12A8FF,
#2563EB,
#8B2CFF,
#F03BD4
);


background-size:400% 400%;

animation:buttonMove 5s ease infinite;

}



@keyframes buttonMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}




#message{
color:red;
}
 
  .swipe-register{

position:relative;
width:100%;
height:50px;
border:2px solid #00c853;
border-radius:25px;
margin-top:15px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
user-select:none;
color:#00a844;
font-weight:bold;

}


.swipe-fill{

position:absolute;
right:0;
top:0;
height:100%;
width:0%;
background:linear-gradient(
90deg,
#00c853,
#00e676
);

transition:0.1s;

}


.swipe-register span{

position:relative;
z-index:2;
transition:.3s;

}


.swipe-circle{

position:absolute;
right:5px;
z-index:3;

width:38px;
height:38px;

border-radius:50%;

background:#00c853;
color:white;

display:flex;
align-items:center;
justify-content:center;

}


.swipe-register.done span{

color:white;

}


.swipe-register.done .swipe-circle{

background:white;
color:#00c853;

}

</style>

</head>

<body>

<div class="login-box">

<img src="logo.png" class="logo">

<h2>لوحة الإدارة</h2>

<input id="username" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<div class="swipe-register" id="swipeRegister">
    <div class="swipe-fill"></div>
    <span>اسحب لطلب إنشاء حساب</span>
    <div class="swipe-circle">➜</div>
</div>


<a href="forgot.html" style="
display:block;
margin-top:15px;
color:#555;
text-decoration:none;
">
نسيت كلمة المرور؟
</a>


<div id="message"></div>

</div>


<script>

function login(){

let username=document.getElementById("username").value.trim();
let password=document.getElementById("password").value.trim();


fetch("https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec",
{

method:"POST",

body:JSON.stringify({

action:"login",
username:username,
password:password

})

})

.then(r=>r.json())

.then(data=>{


if(!data.success){

document.getElementById("message").innerHTML=data.message;
return;

}


if(data.role.trim()=="مدير النظام"){
localStorage.setItem("loggedIn","true");
localStorage.setItem("role",data.role.trim());
localStorage.setItem("lastActivity",Date.now());
location.replace(
"https://maqshoush.github.io/customer-feedback-kelijachino-alnakhil/dashboard.html"
);

}


else if(data.role.trim()=="موظف"){
if(data.role.trim()=="مدير النظام"){

localStorage.setItem("loggedIn","true");
localStorage.setItem("role",data.role.trim());
localStorage.setItem("lastActivity",Date.now());

location.replace(
"https://maqshoush.github.io/customer-feedback-kelijachino-alnakhil/dashboard.html"
);

}
location.replace(
"https://script.google.com/macros/s/AKfycbxWIzQoHaQA0RtQiXrL6N0xjcXEE0StIxTrvdsSiGqkvBBYkeX07-ve58jeACZXTdgk_A/exec"
);

}


else{

document.getElementById("message").innerHTML=
"صلاحية غير معروفة";

}


})

.catch(()=>{

document.getElementById("message").innerHTML=
"خطأ في الاتصال";

});


}
let swipe = document.getElementById("swipeRegister");
let fill = swipe.querySelector(".swipe-fill");
let text = swipe.querySelector("span");
let circle = swipe.querySelector(".swipe-circle");

let startX = 0;
let current = 0;
let dragging = false;


swipe.addEventListener("mousedown",start);
swipe.addEventListener("touchstart",start);


function start(e){

dragging=true;

startX = e.touches ? e.touches[0].clientX : e.clientX;

}


document.addEventListener("mousemove",move);
document.addEventListener("touchmove",move);


function move(e){

if(!dragging) return;


let x = e.touches ? e.touches[0].clientX : e.clientX;

let diff = startX - x;


current = Math.max(0,Math.min(diff, swipe.offsetWidth));


let percent = (current / swipe.offsetWidth) * 100;


fill.style.width = percent+"%";


if(percent > 20){

text.style.opacity = 1 - percent/100;

}


if(percent >= 85){

dragging=false;

swipe.classList.add("done");

circle.innerHTML="✓";


setTimeout(()=>{

window.location.href="register.html";

},500);

}

}



document.addEventListener("mouseup",reset);
document.addEventListener("touchend",reset);


function reset(){

if(!dragging) return;

dragging=false;


if(current < swipe.offsetWidth*0.85){

fill.style.width="0%";

text.style.opacity="1";

}

}
</script>


</body>

</html>
