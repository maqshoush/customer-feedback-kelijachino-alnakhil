<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة كليجاتشينو</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:30px;
border-radius:15px;
width:320px;
box-shadow:0 0 15px #ccc;
text-align:center;
}

input{
width:90%;
padding:12px;
margin:10px;
border-radius:8px;
border:1px solid #ddd;
}

button{
background:#222;
color:white;
padding:12px 25px;
border:0;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">

<h2>لوحة الإدارة</h2>

<input id="user" placeholder="اسم المستخدم">

<input id="pass" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<p id="msg"></p>

</div>


<script>

function login(){

let user=document.getElementById("user").value;
let pass=document.getElementById("pass").value;


if(user=="admin" && pass=="1234"){

window.location="dashboard.html";

}

else{

document.getElementById("msg").innerHTML="بيانات الدخول غير صحيحة";

}

}

</script>

</body>
</html>
