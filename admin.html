<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f7f7f7;
}

.login-box{
width:90%;
max-width:400px;
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 5px 25px #0002;
text-align:center;
}

input,button{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
font-size:16px;
}

input{
border:1px solid #ddd;
}

button{
border:0;
background:#222;
color:white;
cursor:pointer;
}

#message{
color:red;
}
</style>

</head>

<body>

<div class="login-box">

<h2>لوحة الإدارة</h2>

<input id="username" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<a href="forgot.html" style="
display:block;
margin-top:10px;
color:#555;
text-decoration:none;
">
نسيت كلمة المرور؟
</a>

<a href="register.html" style="
display:block;
margin-top:10px;
">
طلب إنشاء حساب جديد
</a>




<div id="message"></div>

</div>


<script>

function login(){

let username=document.getElementById("username").value.trim();
let password=document.getElementById("password").value.trim();


fetch("https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec",
{

method:"POST",

body:JSON.stringify({

action:"login",
username:username,
password:password

})

})

.then(r=>r.json())

.then(data=>{


if(!data.success){

document.getElementById("message").innerHTML=data.message;
return;

}


if(data.role.trim()=="مدير النظام"){

location.replace(
"https://maqshoush.github.io/customer-feedback-kelijachino-alnakhil/dashboard.html"
);

}


else if(data.role.trim()=="موظف"){

location.replace(
"https://script.google.com/macros/s/AKfycbxWIzQoHaQA0RtQiXrL6N0xjcXEE0StIxTrvdsSiGqkvBBYkeX07-ve58jeACZXTdgk_A/exec"
);

}


else{

document.getElementById("message").innerHTML=
"صلاحية غير معروفة";

}


})

.catch(()=>{

document.getElementById("message").innerHTML=
"خطأ في الاتصال";

});


}

</script>


</body>

</html>
