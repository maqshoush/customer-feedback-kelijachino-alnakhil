<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلب إنشاء حساب</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f5f5f5;
}

.box{

width:90%;
max-width:420px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #0002;
text-align:center;

}

h2{
margin-bottom:25px;
}

input,select{

width:100%;
padding:13px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;

}

button{

width:100%;
padding:14px;
border:0;
border-radius:10px;
background:green;
color:white;
font-size:16px;
cursor:pointer;

}


#msg{

margin-top:15px;

}
 .swipe-container{

width:100%;
height:55px;
background:linear-gradient(
90deg,
#0b8f2f,
#1597ff,
#6c35ff
);

background-size:200% 100%;

border-radius:15px;
position:relative;
overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

color:white;
font-size:18px;
font-weight:bold;

transition:background-position .2s;

}


.swipe-circle{

position:absolute;
right:5px;

width:45px;
height:45px;

background:white;
color:#0b8f2f;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:32px;
font-weight:900;


transition:.1s;

} 

</style>

</head>


<body>


<div class="box">


<h2>طلب إنشاء حساب جديد</h2>


<input id="name" placeholder="الاسم الكامل">

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="phone" placeholder="رقم الجوال">

<input id="username" placeholder="اسم المستخدم">

<input id="password" type="password" placeholder="كلمة المرور">


<select id="type">

<option value="موظف">موظف</option>

<option value="مدير النظام">مدير النظام</option>

</select>


<div class="swipe-container" id="swipe">
    <div class="swipe-text">اسحب لإرسال الطلب</div>
    <div class="swipe-circle">←</div>
</div>


<div id="msg"></div>


</div>



<script>


function sendRequest(){


let data={

action:"register",

name:document.getElementById("name").value.trim(),

email:document.getElementById("email").value.trim(),

phone:document.getElementById("phone").value.trim(),

username:document.getElementById("username").value.trim(),

password:document.getElementById("password").value.trim(),

type:document.getElementById("type").value

};



if(
data.name=="" ||
data.email=="" ||
data.phone=="" ||
data.username=="" ||
data.password==""

){

document.getElementById("msg").style.color="red";

document.getElementById("msg").innerHTML=
"الرجاء تعبئة جميع البيانات";

return;

}



fetch(
"https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec",
{

method:"POST",

headers:{

"Content-Type":"text/plain;charset=utf-8"

},

body:JSON.stringify(data)

}

)


.then(r=>r.json())


.then(res=>{

if(res.success){

circle.style.transform="translateX(-230px)";

document.getElementById("msg").style.color="green";

document.getElementById("msg").innerHTML=
"تم إرسال الطلب، سيتم مراجعة الحساب";

}
 
else{

circle.style.transform="translateX(0)";

document.getElementById("msg").style.color="red";

document.getElementById("msg").innerHTML=
res.message;

}


})


.catch(()=>{


document.getElementById("msg").style.color="red";

document.getElementById("msg").innerHTML=
"حدث خطأ في الاتصال";


});


}

let swipe=document.getElementById("swipe");
let circle=swipe.querySelector(".swipe-circle");

let startX=0;
let currentX=0;
let dragging=false;


circle.addEventListener("touchstart",e=>{

dragging=true;

startX=e.touches[0].clientX;

});
circle.addEventListener("touchmove",e=>{

if(!dragging) return;

currentX=e.touches[0].clientX;

let move=startX-currentX;


if(move>0 && move<230){

circle.style.transform=`translateX(-${move}px)`;


/* تغيير لون الزر مع السحب */

let percent = move / 230 * 100;

swipe.style.backgroundPosition =
percent + "% 50%";

}
});

circle.addEventListener("touchend",()=>{

let moved=parseInt(
circle.style.transform.replace("translateX(-","").replace("px)","")
)||0;


if(moved>170){

// فحص البيانات قبل الإرسال

let inputs=document.querySelectorAll("input");

let empty=false;

inputs.forEach(input=>{

if(input.value.trim()==""){
empty=true;
}

});


if(empty){

circle.style.transform="translateX(0)";
dragging=false;
return;

}




sendRequest();


}else{

circle.style.transform="translateX(0)";

}

dragging=false;
});





</script>


</body>

</html>
