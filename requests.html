<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<script src="auth.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلبات التسجيل</title>


<style>
 .skeleton-card{

background:white;

border-radius:20px;

height:180px;

margin:20px 0;

overflow:hidden;

position:relative;

box-shadow:0 8px 25px rgba(0,0,0,.08);

}


body.dark .skeleton-card{

background:#1e1e1e;

} 


.skeleton-card::before{

content:"";

position:absolute;

top:0;
left:-100%;

width:100%;
height:100%;

background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.8),
transparent
);

animation:loading 1.3s infinite;

}



.skeleton-line{

height:15px;

background:#e5e5e5;

border-radius:10px;

margin:25px;

}


body.dark .skeleton-line{

background:#333;

}


@keyframes loading{

100%{

left:100%;

}

}
  


body{

margin:0;
background:#f5f5f5;
padding:30px;
}

 .back-btn{

position:fixed !important;

top:20px !important;
right:20px !important;

z-index:999999999 !important;

width:52px;
height:52px;

border-radius:50%;

border:1px solid rgba(0,0,0,0.15);

background:rgba(255,255,255,0.6);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

}

.back-btn span{

font-size:38px;

color:#111;

font-weight:300;

line-height:1;

}

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}


body{

margin:0;
background:#f5f5f5;
padding:30px;

}



.container{

max-width:1200px;
margin:auto;

}



h1{

text-align:center;
margin-bottom:35px;
color:#222;

}



.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;

}



.card{

background:white;
border-radius:22px;
padding:25px;

border:2px solid #22c55e;

box-shadow:0 8px 25px rgba(0,0,0,.08);

}



.icon{

text-align:center;
font-size:45px;
margin-bottom:15px;

}



.info{

margin-bottom:10px;
color:#444;

}



.info span{

font-weight:bold;
color:#222;

}



.status{

display:inline-block;
padding:7px 15px;
border-radius:20px;
background:#fff3cd;
color:#a16207;

}



.actions{

display:flex;
gap:10px;
margin-top:20px;

}



button{

flex:1;
padding:12px;

border:0;
border-radius:12px;

cursor:pointer;

font-size:15px;
}


.accept{

background:#16a34a;
color:white;

}



.reject{

background:#dc2626;
color:white;

}



.empty{

background:white;
padding:30px;
border-radius:20px;
text-align:center;

}

body.dark{

background:#111;
color:white;

}

body.dark .empty{

background:#1e1e1e;
color:white;

}
body.dark .card,
body.dark .box{

background:#1e1e1e;
color:white;

}


body.dark h1,
body.dark h2{

color:white;

}


body.dark .info{

color:#ddd;

}


body.dark .info span{

color:white;

}


body.dark button{

color:white;

}
</style>


</head>


<body>
<button class="back-btn" onclick="goBack()">
<span>‹</span>
</button>

<div class="container">


<h1>
👤➕ طلبات التسجيل الجديدة
</h1>



<div id="list" class="cards"></div>



</div>




<script>


const URL="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";

document.getElementById("list").innerHTML=`

<div class="skeleton-card">
<div class="skeleton-line"></div>
<div class="skeleton-line"></div>
<div class="skeleton-line"></div>
</div>

<div class="skeleton-card">
<div class="skeleton-line"></div>
<div class="skeleton-line"></div>
<div class="skeleton-line"></div>
</div>

`;

fetch(URL,{
method:"POST",
body:JSON.stringify({
action:"requests"
})
})


.then(r=>r.json())


.then(data=>{


let html="";


if(data.length==0){

html=`
<div class="empty">
لا توجد طلبات تسجيل حالياً
</div>
`;

}

else{


data.forEach(r=>{


html+=`

<div class="card">


<div class="icon">
👤➕
</div>



<div class="info">
<span>الاسم:</span>
${r.name}
</div>



<div class="info">
<span>اسم المستخدم:</span>
${r.username}
</div>



<div class="info">
<span>البريد:</span>
${r.email}
</div>



<div class="info">
<span>الجوال:</span>
${r.phone}
</div>



<div class="info">

<span>الحالة:</span>

<br>

<span class="status">
${r.status}
</span>

</div>



<div class="actions">


<button class="accept" onclick="approve(${r.row})">

✅ قبول

</button>



<button class="reject" onclick="reject(${r.row})">

❌ رفض

</button>


</div>


</div>


`;

});


}



document.getElementById("list").innerHTML=html;


});







function approve(row){


if(confirm("هل أنت متأكد من قبول الطلب؟")){


fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"approve",

row:row

})

})

.then(()=>location.reload());


}


}





function reject(row){


if(confirm("هل أنت متأكد من رفض الطلب؟")){


fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"reject",

row:row

})

})

.then(()=>location.reload());


}


}

function goBack(){

window.location.href="dashboard.html";

}

</script>


<script src="theme.js"></script>
</body>

</html>
