<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b9895f">
  <title> تقييم الخدمة | كليجاتشينو   </title>

  <style>
    :root{
      --brand:#b9895f;
      --brand-dark:#755039;
      --cream:#fbf7f2;
      --text:#231f20;
      --muted:#6e625c;
      --yes:#258c57;
      --no:#c84b45;
      --wa:#25D366;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
      color:var(--text);

      background:
        radial-gradient(
          circle at top right,
          rgba(185,137,95,.18),
          transparent 34%
        ),
        linear-gradient(
          160deg,
          #fff,
          var(--cream)
        );

      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }

    .wrap{
      width:100%;
      max-width:500px;
    }

    .card{
      background:#fff;

      border:
        1px solid
        rgba(117,80,57,.10);

      border-radius:26px;

      box-shadow:
        0 18px 55px
        rgba(80,53,38,.14);

      padding:
        25px 20px 22px;

      text-align:center;
      overflow:hidden;

      animation:
        show .22s ease;
    }

    @keyframes show{
      from{
        opacity:0;
        transform:translateY(7px);
      }

      to{
        opacity:1;
        transform:none;
      }
    }

    .brand-image{
      width:100%;
      max-height:210px;
      object-fit:contain;
      border-radius:18px;
      margin-bottom:13px;
      background:#fff;
    }

    .icon{
      width:78px;
      height:78px;
      border-radius:50%;

      display:grid;
      place-items:center;

      margin:
        0 auto 17px;

      font-size:37px;
      font-weight:900;

      color:#fff;
      background:var(--brand);
    }

    h1{
      font-size:26px;
      margin:4px 0 12px;
      line-height:1.45;
    }

    p{
      font-size:18px;
      line-height:1.8;
      color:var(--muted);
      margin:0 0 22px;
    }

    .buttons{
      display:grid;
      gap:12px;
    }

    button,
    .btn{
      display:block;
      width:100%;
      border:0;
      border-radius:15px;
      padding:15px 17px;

      font-size:18px;
      font-weight:800;

      cursor:pointer;
      text-decoration:none;

      transition:
        transform .12s ease,
        opacity .12s ease;
    }

    button:active,
    .btn:active{
      transform:scale(.985);
    }

    .yes{
      background:var(--yes);
      color:#fff;
    }

    .no{
      background:var(--no);
      color:#fff;
    }

    .google{
      background:var(--brand-dark);
      color:#fff;
    }

    .whatsapp{
      background:var(--wa);
      color:#fff;
    }

    .back{
      margin-top:12px;
      background:#efe7e1;
      color:var(--brand-dark);
    }

    .note{
      font-size:13px;
      color:#9a8e88;
      margin-top:16px;
    }

    .hidden{
      display:none;
    }


    /* ==========================================
       توقيع RIDEX
    ========================================== */

    .ridex-signature{
      margin:22px auto 0;

      width:100%;

      padding:
        17px 10px 15px;

      text-align:center;

      /*
        مستطيل RIDEX
        واضح من فوق وتحت
        ويذوب فقط من اليمين واليسار
      */
      background:
        linear-gradient(
          90deg,

          transparent 0%,

          rgba(18,168,255,.16) 12%,

          rgba(37,99,235,.22) 32%,

          rgba(139,44,255,.22) 58%,

          rgba(240,59,212,.17) 85%,

          transparent 100%
        );

      border-radius:0;
    }


    /* مدعوم من ريدكس | Powered by RIDEX */

    .ridex-powered-line{
      display:flex;

      align-items:center;
      justify-content:center;

      gap:6px;

      font-size:13px;
      font-weight:600;

      color:#555;

      white-space:nowrap;
    }


    /* الخط الفاصل */

    .ridex-divider{
      color:#888;
    }


    /* RIDEX و ريدكس */

    .ridex-name{
      font-weight:900;

      background:
        linear-gradient(
          90deg,
          #12A8FF,
          #2563EB,
          #8B2CFF,
          #F03BD4
        );

      -webkit-background-clip:text;
      background-clip:text;

      -webkit-text-fill-color:transparent;
      color:transparent;
    }


    /* وصف النظام */

    .ridex-description{
      margin-top:5px;

      font-size:11px;
      font-weight:500;

      color:#777;
    }


    /* التواصل */

    .ridex-contact{
      margin-top:6px;

      font-size:10px;
      font-weight:500;

      color:#777;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:5px;

      flex-wrap:wrap;
    }


    /* رابط واتساب */

    .ridex-whatsapp-link{
      display:inline-flex;

      align-items:center;
      justify-content:center;

      gap:4px;

      direction:ltr;

      color:#2563EB;

      font-weight:800;

      text-decoration:underline;
      text-underline-offset:2px;

      cursor:pointer;
    }


    .ridex-whatsapp-link:hover{
      opacity:.8;
    }


    /* الرقم */

    .ridex-phone{
      direction:ltr;
    }


    /* علامة واتساب يسار الرقم */

    .ridex-whatsapp-icon{
      width:14px;
      height:14px;

      color:#25D366;

      flex-shrink:0;
    }

  </style>
</head>


<body>

  <main class="wrap">


    <!-- =========================================
         صفحة السؤال
    ========================================= -->

    <section
      class="card"
      id="questionPage"
    >

      <img
        class="brand-image"
        src="kelijachino-logo.png"
        alt="كليجاتشينو فرع النخيل"
      >

      <h1>
        هل أنت راضٍ عن الخدمة المقدمة؟
      </h1>

      <div class="buttons">

        <button class="yes">
          نعم
        </button>

        <button class="no">
          لا
        </button>

      </div>

      <div class="note">
        كليجاتشينو
      </div>

    </section>



    <!-- =========================================
         صفحة نعم
    ========================================= -->

    <section
      class="card hidden"
      id="yesPage"
    >

      <div class="icon">
        ✓
      </div>

      <h1>
        شكراً لك
      </h1>

      <p>
        يسعدنا تقييمك على جوجل
      </p>

      <a
        class="btn google"
        href="https://g.page/r/Ca0IokSC73stEAE/review"
        target="_blank"
        rel="noopener noreferrer"
      >
        قيّمنا
      </a>

      <button
        class="back"
        onclick="showPage('questionPage')"
      >
        رجوع
      </button>

    </section>



    <!-- =========================================
         صفحة لا
    ========================================= -->

    <section
      class="card hidden"
      id="noPage"
    >

      <div class="icon">
        !
      </div>

      <h1>
        يؤسفنا سماع ذلك
      </h1>

      <p>
        نرجو التواصل معنا
      </p>

      <a
        class="btn whatsapp"
        href="https://wa.me/966545554873?text=السلام عليكم، لدي ملاحظة على الخدمة في كليجاتشينو  "
        target="_blank"
        rel="noopener noreferrer"
      >
        تواصل معنا
      </a>

      <button
        class="back"
        onclick="showPage('questionPage')"
      >
        رجوع
      </button>

    </section>



    <!-- =========================================
         توقيع RIDEX
    ========================================= -->

    <div class="ridex-signature">


      <div class="ridex-powered-line">

        <span dir="rtl">
          مدعوم من
          <span class="ridex-name">
            ريدكس
          </span>
        </span>

        <span class="ridex-divider">
          |
        </span>

        <span dir="ltr">
          Powered by
          <span class="ridex-name">
            RIDEX
          </span>
        </span>

      </div>


      <div class="ridex-description">
        - نظام إدارة رضا العملاء -
      </div>


      <div class="ridex-contact">

        <span>
          لمزيد من التفاصيل تواصل معنا :
        </span>


        <a
          class="ridex-whatsapp-link"
          href="https://wa.me/966582261016?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D8%8C%20%D8%A8%D8%BA%D9%8A%D8%AA%20%D8%A3%D8%B3%D8%AA%D9%81%D8%B3%D8%B1%20%D8%B9%D9%86%20%D9%86%D8%B8%D8%A7%D9%85%20RIDEX%20%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D8%AE%D8%AF%D9%85%20%D8%A8%D8%A3%D8%AD%D8%AF%20%D8%A7%D9%84%D9%85%D9%86%D8%B4%D8%A2%D8%AA"
          target="_blank"
          rel="noopener noreferrer"
        >

          <!-- شعار واتساب -->

          <svg
            class="ridex-whatsapp-icon"
            viewBox="0 0 32 32"
            aria-hidden="true"
          >

            <path
              fill="currentColor"
              d="M16.04 3C9.41 3 4.02 8.39 4.02 15.02c0 2.12.55 4.19 1.6 6.01L3.92 27.2l6.32-1.66a12 12 0 0 0 5.79 1.48h.01c6.63 0 12.02-5.39 12.02-12.02S22.67 3 16.04 3Zm0 21.98h-.01a9.96 9.96 0 0 1-5.08-1.39l-.36-.21-3.75.98 1-3.65-.24-.38a9.96 9.96 0 1 1 8.44 4.65Zm5.46-7.46c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49 0 1.47 1.07 2.89 1.22 3.09.15.2 2.11 3.22 5.11 4.52.71.31 1.27.49 1.7.63.71.23 1.36.19 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"
            />

          </svg>


          <!-- الرقم -->

          <span class="ridex-phone">
            0582261016
          </span>

        </a>

      </div>


    </div>

  </main>



  <script>

    function showPage(id){

      document
        .querySelectorAll('.card')
        .forEach(
          el =>
            el.classList.add('hidden')
        );

      document
        .getElementById(id)
        .classList
        .remove('hidden');

      window.scrollTo({
        top:0,
        behavior:'smooth'
      });

    }


    const WEB_APP_URL="https://script.google.com/macros/s/AKfycbz2Lrqyk4wkEhxE1cOq9OQbmGeTknutUilFbVrlj2L3KdFAUAw823r9hPRr7ItebFE3Rw/exec ";


    async function sendRating(rating){

      try{

        await fetch(
          WEB_APP_URL,
          {
            method:"POST",
            mode:"no-cors",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                rating:
                  rating,

                timestamp:
                  new Date()
                    .toISOString(),

                browser:
                  navigator.userAgent,

                device:
                  /Mobi|Android|iPhone|iPad/i
                    .test(
                      navigator.userAgent
                    )
                    ? "Mobile"
                    : "Desktop"

              })
          }
        );

      }catch(e){}

    }


    document
      .querySelector(".yes")
      .addEventListener(
        "click",
        () => {

          showPage(
            "yesPage"
          );

          sendRating(
            "Yes"
          );

        }
      );


    document
      .querySelector(".no")
      .addEventListener(
        "click",
        () => {

          showPage(
            "noPage"
          );

          sendRating(
            "No"
          );

        }
      );

  </script>

</body>
</html>
