<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استعادة الحساب</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f7f7f7;
}

.box{
width:90%;
max-width:400px;
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 5px 25px #0002;
text-align:center;
}

input,button{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
font-size:16px;
}

input{
border:1px solid #ddd;
}

button{
border:0;
background:#222;
color:white;
cursor:pointer;
}

#codeBox{
display:none;
}

#msg{
color:red;
}

</style>

</head>


<body>


<div class="box">


<h2>
استعادة الحساب
</h2>


<p>
اكتب البريد الإلكتروني المسجل مسبقاً
</p>


<input id="email" placeholder="البريد الإلكتروني">


<div id="codeBox">

<input id="code" placeholder="رمز التحقق">

</div>


<button onclick="sendCode()" id="sendBtn">
إرسال رمز التحقق
</button>


<button onclick="verify()" id="verifyBtn" style="display:none;">
تأكيد الرمز
</button>


<div id="msg"></div>


</div>



<script>


const URL="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";



function sendCode(){


let email=document.getElementById("email").value.trim();


fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"forgot",

email:email

})

})


.then(r=>r.json())

.then(data=>{


if(data.success){


document.getElementById("msg").style.color="green";

document.getElementById("msg").innerHTML=
"تم إرسال رمز التحقق";


document.getElementById("codeBox").style.display="block";

document.getElementById("sendBtn").style.display="none";

document.getElementById("verifyBtn").style.display="block";


}

else{

document.getElementById("msg").innerHTML=data.message;

}


});


}




function verify(){


let email=document.getElementById("email").value.trim();

let code=document.getElementById("code").value.trim();



fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"verifyCode",

email:email,

code:code

})

})


.then(r=>r.json())

.then(data=>{


if(data.success){


location.href=
"newpassword.html?email="+email;


}

else{

document.getElementById("msg").innerHTML=
data.message;

}


});


}


</script>


</body>

</html>
