<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استعادة الحساب</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f7f7f7;
}

.box{

width:90%;
max-width:400px;
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 5px 25px #0002;
text-align:center;

}

input,button{

width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
font-size:16px;

}

input{

border:1px solid #ddd;

}

button{

border:0;
background:#222;
color:white;
cursor:pointer;

}

#msg{

color:red;

}

</style>

</head>


<body>


<div class="box">


<h2>
استعادة الحساب
</h2>


<p>
اكتب البريد الإلكتروني المسجل مسبقاً
</p>


<input id="email" placeholder="البريد الإلكتروني">


<button onclick="sendCode()">
إرسال رمز التحقق
</button>


<div id="msg"></div>


</div>



<script>


const URL="https://script.google.com/macros/s/AKfycbxbnrzn9Wr9bw7Wwx_1orSMU-r_he6PkfR0sne79blA63DDHirYcMSdgznHc6c-av0vqw/exec";


function sendCode(){


let email=document.getElementById("email").value.trim();


if(email==""){

document.getElementById("msg").innerHTML=
"اكتب البريد الإلكتروني";

return;

}



fetch(URL,{

method:"POST",

body:JSON.stringify({

action:"forgot",

email:email

})

})


.then(r=>r.json())

.then(data=>{


if(data.success){

document.getElementById("msg").style.color="green";

document.getElementById("msg").innerHTML=
"تم إرسال رمز التحقق إلى بريدك";

}

else{

document.getElementById("msg").innerHTML=
data.message;

}


})


.catch(()=>{

document.getElementById("msg").innerHTML=
"حدث خطأ في الاتصال";

});


}


</script>


</body>

</html>
